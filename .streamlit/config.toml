# Listen on all network interfaces so others on your LAN can open the dashboard.
# For reliable public sharing, deploy to Streamlit Community Cloud (see docs/CLOUD_DEPLOYMENT_CHECKLIST.txt).
# Local LAN share: http://YOUR_PC_IP:8501
[server]
address = "0.0.0.0"
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50
headless = true

[browser]
gatherUsageStats = false
# Use localhost in the browser — 0.0.0.0 is listen-only, not a valid URL to open
serverAddress = "localhost"
serverPort = 8501

[runner]
fastReruns = true
